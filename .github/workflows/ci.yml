name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # 24.04 ships the same automake (1.16.5) and autoconf (2.71) that
    # generated the versioned configure and Makefile.in files
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential automake autoconf autopoint libtool gettext pkg-config \
            valac libglib2.0-dev libgtk-3-dev libcairo2-dev libgdk-pixbuf-2.0-dev \
            libgee-0.8-dev libbamf3-dev libwnck-3-dev libgnome-menu-3-dev \
            libdbusmenu-gtk3-dev libx11-dev libxdamage-dev libxi-dev libxfixes-dev \
            libxml2-utils \
            xvfb xauth dbus dbus-x11 at-spi2-core

      # configure and the Makefile.in files are versioned, so autogen.sh is
      # not needed. Autotools are installed anyway: maintainer mode may
      # regenerate them when checkout timestamps make them look stale.
      - name: Build
        run: scripts/build-dock-e

      - name: Test
        # The tests need an X display (xvfb-run, from the script) and a
        # session bus
        run: dbus-run-session -- scripts/test-dock-e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            .build/tests/test-report.xml
            .build/config.log
          if-no-files-found: ignore
